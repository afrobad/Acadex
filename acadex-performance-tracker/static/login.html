<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Acadex · Faculty Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background: #f4f6fb;
      color: #1c2333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: #1d3a8a;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h2 { margin: 0; font-size: 20px; font-weight: 600; }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: #fff;
      max-width: 420px;
      width: 100%;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    h3 { margin-top: 0; margin-bottom: 8px; color: #1d3a8a; }
    p.subtitle { margin-top: 0; margin-bottom: 20px; color: #555; font-size: 14px; }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccd;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #1d3a8a;
      box-shadow: 0 0 0 3px rgba(29,58,138,0.15);
    }
    input.invalid {
      border-color: #b00020;
      background-color: #fff9f9;
    }
    .field-error {
      color: #b00020;
      font-size: 12px;
      margin-top: 4px;
      min-height: 16px;
    }
    .alert-error {
      background: #fde2e2;
      color: #b00020;
      border: 1px solid #f9bcbc;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    button.submit-btn {
      width: 100%;
      background: #1d3a8a;
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button.submit-btn:hover { background: #162d6b; }
    .footer-links {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: #555;
    }
    .footer-links a {
      color: #1d3a8a;
      text-decoration: none;
      font-weight: 600;
    }
    .footer-links a:hover { text-decoration: underline; }
    .demo-box {
      margin-top: 20px;
      background: #eef3ff;
      border: 1px dashed #7a9fea;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      color: #1d3a8a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .demo-btn {
      background: #fff;
      border: 1px solid #1d3a8a;
      color: #1d3a8a;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .demo-btn:hover {
      background: #1d3a8a;
      color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <h2>Acadex · Performance Tracker</h2>
  </header>

  <main>
    <div class="card">
      <h3>Faculty Login</h3>
      <p class="subtitle">Access your course performance metrics and warnings.</p>

      <div id="general-error" class="alert-error"></div>

      <form id="login-form" onsubmit="handleLogin(event)" novalidate>
        <div class="form-group">
          <label for="email">Institutional Email</label>
          <input type="email" id="email" placeholder="faculty@diu.edu.bd" autocomplete="email" required>
          <div class="field-error" id="email-error"></div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
          <div class="field-error" id="password-error"></div>
        </div>

        <button type="submit" class="submit-btn" id="btn-submit">Sign In</button>
      </form>

      <div class="demo-box">
        <div>
          <strong>Demo Account:</strong><br>
          faculty@diu.edu.bd / Password123
        </div>
        <button type="button" class="demo-btn" onclick="fillDemo()">Auto-Fill</button>
      </div>

      <div class="footer-links">
        Don't have an account? <a href="/register">Register here</a>
      </div>
    </div>
  </main>

  <script>
    // Redirect if already logged in
    if (localStorage.getItem("acadex_token")) {
      window.location.href = "/";
    }

    function clearErrors() {
      document.getElementById("general-error").style.display = "none";
      document.getElementById("general-error").textContent = "";
      document.getElementById("email-error").textContent = "";
      document.getElementById("password-error").textContent = "";
      document.getElementById("email").classList.remove("invalid");
      document.getElementById("password").classList.remove("invalid");
    }

    function fillDemo() {
      document.getElementById("email").value = "faculty@diu.edu.bd";
      document.getElementById("password").value = "Password123";
      clearErrors();
    }

    async function handleLogin(e) {
      e.preventDefault();
      clearErrors();

      const emailEl = document.getElementById("email");
      const passwordEl = document.getElementById("password");
      const email = emailEl.value.trim();
      const password = passwordEl.value;

      let clientError = false;
      if (!email) {
        document.getElementById("email-error").textContent = "Email is required.";
        emailEl.classList.add("invalid");
        clientError = true;
      }
      if (!password) {
        document.getElementById("password-error").textContent = "Password is required.";
        passwordEl.classList.add("invalid");
        clientError = true;
      }
      if (clientError) return;

      const submitBtn = document.getElementById("btn-submit");
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing In...";

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          if (response.status === 422 && Array.isArray(data.detail)) {
            data.detail.forEach(err => {
              const field = err.loc[err.loc.length - 1];
              const errEl = document.getElementById(`${field}-error`);
              const inputEl = document.getElementById(field);
              if (errEl) errEl.textContent = err.msg;
              if (inputEl) inputEl.classList.add("invalid");
            });
          } else {
            const genErr = document.getElementById("general-error");
            genErr.textContent = data.detail || "Authentication failed. Please check your credentials.";
            genErr.style.display = "block";
          }
          return;
        }

        // Store JWT token and user info
        localStorage.setItem("acadex_token", data.access_token);
        localStorage.setItem("acadex_user", JSON.stringify(data.user));

        // Redirect to dashboard
        window.location.href = "/";
      } catch (err) {
        const genErr = document.getElementById("general-error");
        genErr.textContent = "Server connection error. Please try again.";
        genErr.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
      }
    }
  </script>
</body>
</html>
